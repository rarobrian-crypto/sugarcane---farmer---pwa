<title>My Farms — Sugarcane GIS (Preview)</title>

<style>body{background:#37474F;}#phone-frame{max-width:390px;margin:0 auto;background:#F3F6F5;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.5);}
:root{
  --primary:#2E7D32;
  --primary-dark:#1B5E20;
  --primary-light:#43A047;
  --primary-tint:#EAF6EC;
  --secondary:#1E88E5;
  --secondary-tint:#E8F2FD;
  --warning:#F57C00;
  --warning-tint:#FFF3E0;
  --danger:#E53935;
  --danger-tint:#FDECEA;
  --background:#F3F6F5;
  --panel:#FFFFFF;
  --text:#1F2937;
  --muted:#6B7280;
  --border:#EAEDEF;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 8px 24px rgba(20,40,30,.07);
  --shadow-sm:0 4px 12px rgba(20,40,30,.06);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:"Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:var(--background);
  color:var(--text);
  overscroll-behavior-y:none;
  -webkit-tap-highlight-color:transparent;
}
button, input, textarea, select{font-family:inherit;}
a{color:inherit;text-decoration:none;}
button{cursor:pointer;}

#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--background);
  position:relative;
}

/* ---------- Top App Bar ---------- */
.appbar{
  background:var(--primary-dark);
  color:#fff;
  padding:calc(14px + var(--safe-top)) 16px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:20;
}
.appbar h1{font-size:17px;font-weight:700;flex:1;}
.appbar .icon-btn{
  width:34px;height:34px;border:none;background:rgba(255,255,255,.16);
  border-radius:11px;color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;position:relative;
}
.appbar.plain{background:transparent;color:var(--text);box-shadow:none;padding-top:calc(16px + var(--safe-top));}
.appbar.plain h1{color:var(--text);}
.appbar.plain .icon-btn{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm);}

  padding:calc(18px + var(--safe-top)) 18px 18px;
  display:flex; align-items:center; gap:12px;
}
.home-header .avatar-photo{
  width:48px;height:48px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary-light),var(--primary-dark));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;
  box-shadow:var(--shadow-sm);
}
.home-header .who{flex:1;}
.home-header .who small{color:rgba(255,255,255,.86);font-size:12px;}
.home-header .who h2{font-size:19px;font-weight:800;color:#fff;}
.home-header .who .farmer-id{font-size:11.5px;color:rgba(255,255,255,.82);}
.bell-btn{
  width:40px;height:40px;border-radius:50%;background:var(--panel);border:none;
  display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--shadow-sm);position:relative;color:var(--text);
}
.badge-dot{
  position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  min-width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--background);padding:0 2px;
}

/* ---------- Weather card ---------- */
.weather-card{
  margin:0 16px 14px;background:linear-gradient(120deg,#FFB74D,#F57C00);
  color:#fff;border-radius:var(--radius);padding:16px 18px;
  display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);
}
.weather-card .wtemp{font-size:26px;font-weight:800;line-height:1;}
.weather-card .wicon{font-size:30px;}
.weather-card .wmeta{flex:1;}
.weather-card .wmeta strong{display:block;font-size:13px;font-weight:700;}
.weather-card .wmeta span{font-size:11.5px;opacity:.9;}
.weather-card .wloc{font-size:11.5px;opacity:.95;display:flex;align-items:center;gap:4px;}
.weather-card.cool{background:linear-gradient(120deg,#64B5F6,#1E88E5);}
.weather-card.rain{background:linear-gradient(120deg,#78909C,#546E7A);}

.intelligence-card{background:linear-gradient(145deg,#fff,#f2f8f3);border:1px solid #dcebe0;}
.intelligence-kicker{font-size:10px;font-weight:900;letter-spacing:.12em;color:#2e7d32;}
.intelligence-card h3{margin:8px 0 6px;color:#183b28;font-size:16px;}
.intelligence-card p,.pilot-card p{font-size:12px;line-height:1.5;color:#56665c;}
.intelligence-status{display:flex;align-items:center;gap:8px;margin-top:13px;color:#1b5e20;font-size:12px;font-weight:800;}
.status-dot{width:8px;height:8px;background:#2e7d32;border-radius:50%;box-shadow:0 0 0 4px #e5f3e8;}
.intelligence-footnote{margin-top:10px;padding-top:10px;border-top:1px solid #e1ece4;color:#65756a;font-size:11px;line-height:1.45;}
.pilot-card{margin:0 16px 16px;padding:14px 16px;border-radius:16px;background:#173e2a;color:#fff;box-shadow:var(--shadow-sm);}
.pilot-card .intelligence-kicker{color:#b7dec0;}
.pilot-steps{display:flex;align-items:center;justify-content:space-between;margin:10px 0 7px;font-size:11px;color:#fff;}
.pilot-steps span{color:#9ac8a5;font-size:17px;}
.pilot-card p{color:#d2e2d6;}
.farm-photo-card{min-height:116px;display:flex;align-items:flex-end;background:linear-gradient(135deg,#1f6740,#123b29);color:#fff;font-size:11px;font-weight:900;letter-spacing:.1em;}
.empty-map-card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:190px;margin-top:12px;padding:20px;text-align:center;border:1px dashed #bfd7c4;border-radius:14px;background:linear-gradient(145deg,#f5faf6,#eaf4ec);}
.empty-map-icon{font-size:30px;margin-bottom:8px;}
.empty-map-card strong{font-size:14px;color:#244b32;}
.empty-map-card p{max-width:260px;margin-top:7px;font-size:12px;line-height:1.5;color:#617268;}

/* ---------- Stat grid ---------- */
.stat-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px 16px;
}
.stat-tile{
  background:var(--panel);border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);
  padding:14px 8px;text-align:center;
}
.stat-tile .sicon{font-size:16px;color:var(--primary);margin-bottom:4px;}
.stat-tile strong{display:block;font-size:17px;font-weight:800;}
.stat-tile span{font-size:10.5px;color:var(--muted);}

/* ---------- Section header row ---------- */
.section-row{
  display:flex;align-items:center;justify-content:space-between;margin:0 16px 10px;
}
.section-row h3{font-size:15px;font-weight:800;color:var(--text);}
.section-row a{font-size:12.5px;color:var(--primary-dark);font-weight:700;}

/* ---------- Farm card (list item with thumbnail) ---------- */
.farm-card{
  display:flex;gap:12px;align-items:center;background:var(--panel);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);padding:12px;margin:0 16px 12px;
}
.farm-thumb{
  width:60px;height:60px;border-radius:14px;flex-shrink:0;position:relative;overflow:hidden;
}
.farm-thumb .rows{position:absolute;inset:0;}
.farm-body{flex:1;min-width:0;}
.farm-body strong{font-size:14.5px;display:block;}
.farm-body .sub{font-size:12px;color:var(--muted);margin-top:1px;}
.farm-body .chips{display:flex;gap:6px;margin-top:6px;align-items:center;}
.farm-arrow{color:#B0BAC0;font-size:16px;}

/* ---------- Pill tabs (segmented control) ---------- */
.pill-tabs{
  display:flex;background:var(--panel);border-radius:999px;padding:4px;box-shadow:var(--shadow-sm);
  margin:0 16px 14px;
}
.pill-tabs button{
  flex:1;border:none;background:transparent;border-radius:999px;padding:9px 6px;
  font-weight:700;font-size:12.5px;color:var(--muted);
}
.pill-tabs button.active{background:var(--primary-dark);color:#fff;}

/* ---------- Content ---------- */
.content{
  flex:1;
  padding:16px 16px calc(96px + var(--safe-bottom));
  overflow-y:auto;
}
.content.no-pad-top{padding-top:0;margin-top:0;}
.content.bleed{padding-left:0;padding-right:0;}
.content.bleed > .card, .content.bleed > .btn{margin-left:16px;margin-right:16px;}

/* ---------- Card ---------- */
.card{
  background:var(--panel);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  padding:16px;
  margin-bottom:14px;
}
.card h3{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:10px;}
.card-row{display:flex;justify-content:space-between;align-items:center;}
.stat-pill{
  display:flex;align-items:center;gap:6px;background:var(--primary-tint);color:var(--primary-dark);
  padding:6px 10px;border-radius:20px;font-size:12.5px;font-weight:700;
}
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;
  font-size:11px;font-weight:800;
}
.badge.growing{background:var(--primary-tint);color:var(--primary-dark);}
.badge.ready{background:var(--warning-tint);color:#E65100;}
.badge.healthy{background:var(--primary-tint);color:var(--primary-dark);}
.badge.overdue{background:var(--danger-tint);color:var(--danger);}
.ndvi-chip{
  font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:8px;background:#F1F3F5;color:var(--text);
}

/* ---------- Quick grid (home) ---------- */
.quick-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;
}
.quick-grid a{
  background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;
  font-size:12.5px;font-weight:700;color:var(--text);
}
.quick-grid .qicon{
  width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;
}

/* ---------- Alert / notice banner ---------- */
.notice{
  background:var(--warning-tint);border:1px solid #FBDFAF;border-radius:var(--radius);
  padding:14px;margin-top:14px;display:flex;gap:10px;
}
.notice .dot{
  width:34px;height:34px;border-radius:50%;background:var(--warning);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;
}
.notice strong{font-size:14px;display:block;}
.notice p{font-size:12.5px;color:var(--muted);margin-top:2px;}
.notice a{color:var(--secondary);font-size:12.5px;font-weight:700;}

/* ---------- Buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:14px;border-radius:14px;border:none;
  font-size:14.5px;font-weight:700;cursor:pointer;
}
.btn-primary{background:var(--primary-dark);color:#fff;}
.btn-secondary{background:#F1F3F5;color:var(--text);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text);}
.btn-sm{padding:9px 14px;font-size:13px;width:auto;}

/* ---------- Form ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:700;}
.field .input-icon{position:relative;}
.field .input-icon span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;}
.field .input-icon input{padding-left:38px;}
.field input, .field textarea{
  width:100%;border:1.5px solid var(--border);border-radius:12px;padding:12px 13px;font-size:14px;
  background:#FAFBFC;color:var(--text);
}
.field textarea{resize:vertical;min-height:70px;}
.toggle-row{display:flex;gap:10px;}
.toggle-row button{
  flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-weight:700;font-size:13.5px;
}
.toggle-row button.active{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark);}

/* ---------- NDVI gauge ---------- */
.gauge-wrap{display:flex;align-items:center;gap:18px;}
.gauge{position:relative;width:96px;height:96px;flex-shrink:0;}
.gauge svg{transform:rotate(-90deg);}
.gauge .center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.gauge .center strong{font-size:20px;color:var(--primary-dark);}
.gauge .center span{font-size:10.5px;color:var(--muted);font-weight:700;}

/* ---------- Sparkline ---------- */
.spark-wrap{flex:1;}
.spark-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px;}

/* ---------- Lists ---------- */
.list-item{
  display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);
}
.list-item:last-child{border-bottom:none;}
.list-item .dot-icon{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;color:#fff;font-size:14px;margin-top:2px;
}
.list-item .body{flex:1;}
.list-item strong{font-size:13.5px;display:block;}
.list-item p{font-size:12.5px;color:var(--muted);margin-top:2px;}
.list-item time{font-size:11px;color:#9CA3AF;white-space:nowrap;}

/* ---------- Alert cards (Alerts screen) ---------- */
.alert-card{
  display:flex;gap:12px;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  padding:14px;margin-bottom:10px;border-left:4px solid var(--border);
}
.alert-card.urgent{border-left-color:var(--danger);}
.alert-card.warning{border-left-color:var(--warning);}
.alert-card.info{border-left-color:var(--secondary);}
.alert-card .aicon{font-size:18px;}
.alert-card .body{flex:1;}
.alert-card strong{font-size:13.5px;display:block;}
.alert-card p{font-size:12.5px;color:var(--muted);margin-top:2px;}
.alert-card time{font-size:11px;color:#9CA3AF;white-space:nowrap;}

/* ---------- Timeline (harvest history) ---------- */
.timeline .t-item{display:flex;gap:12px;position:relative;padding-bottom:18px;}
.timeline .t-item:last-child{padding-bottom:0;}
.timeline .t-item::before{
  content:"";position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--border);
}
.timeline .t-item:last-child::before{display:none;}
.t-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:#fff;z-index:1;}
.t-dot.done{background:var(--primary);}
.t-dot.upcoming{background:var(--warning);}
.t-body strong{font-size:13.5px;}
.t-body p{font-size:12px;color:var(--muted);}
.t-status{margin-left:auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;height:fit-content;}
.t-status.done{background:var(--primary-tint);color:var(--primary-dark);}
.t-status.upcoming{background:var(--warning-tint);color:#E65100;}

/* ---------- Tabs ---------- */
.tabbar{display:flex;background:#fff;border-radius:12px;padding:4px;box-shadow:var(--shadow-sm);margin-bottom:14px;}
.tabbar button{flex:1;padding:10px;border:none;background:transparent;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);}
.tabbar button.active{background:var(--primary-dark);color:#fff;}

/* ---------- Map ---------- */
.map-farm-picker{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center;margin-bottom:12px;padding:12px 14px;}
.map-farm-picker label{font-size:12px;font-weight:800;color:var(--text);}
.map-farm-picker select{grid-column:2;grid-row:1 / span 2;min-width:132px;padding:9px 30px 9px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font-size:13px;font-weight:700;}
.map-farm-picker span{font-size:10.5px;color:var(--muted);}
#leaflet-map{height:420px;}
.leaflet-control-layers{border:0!important;border-radius:10px!important;box-shadow:0 2px 12px rgba(20,40,30,.2)!important;font-size:12px;}
.leaflet-control-attribution{font-size:9px!important;}
.farm-boundary-label{background:#075E36;color:#fff;border:0;border-radius:6px;padding:3px 7px;font-weight:800;box-shadow:0 1px 5px #0005;}
#leaflet-map{width:100%;height:420px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
.map-fab-col{position:absolute;right:28px;top:180px;display:flex;flex-direction:column;gap:8px;z-index:400;}
.map-fab{
  width:38px;height:38px;border-radius:10px;background:#fff;box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;font-size:16px;border:none;
}
.map-info-card{margin-top:-18px;position:relative;z-index:5;}
.map-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.map-legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.map-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

/* ---------- Bottom Nav ---------- */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);
  display:flex;padding-bottom:var(--safe-bottom);z-index:30;
  box-shadow:0 -4px 16px rgba(0,0,0,.04);
}
.bottom-nav button{
  flex:1;border:none;background:transparent;padding:10px 4px 8px;display:flex;flex-direction:column;
  align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--muted);position:relative;
}
.bottom-nav button.active{color:var(--primary-dark);}
.bottom-nav .nav-icon{font-size:18px;}
.bottom-nav .nav-badge{
  position:absolute;top:4px;right:calc(50% - 16px);background:var(--danger);color:#fff;font-size:9px;font-weight:800;
  min-width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}

/* ---------- Sheet (More menu) ---------- */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:10px 16px calc(20px + var(--safe-bottom));
}
.sheet .grip{width:36px;height:4px;background:var(--border);border-radius:4px;margin:6px auto 14px;}
.sheet .sheet-item{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;}
.sheet .sheet-item:last-child{border-bottom:none;}
.sheet .sheet-item .ic{
  width:34px;height:34px;border-radius:10px;background:#F1F3F5;display:flex;align-items:center;justify-content:center;font-size:15px;
}

.splash-hero{
  height:100vh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;text-align:center;padding:20px;overflow:hidden;
  background:
    radial-gradient(circle at 50% 18%, rgba(255,213,140,.9), rgba(255,213,140,0) 32%),
    linear-gradient(180deg,#FFD98A 0%,#FFB65C 16%,#8BC34A 46%,#3E8E41 72%,#1B5E20 100%);
}
.splash-hero::before{
  content:"";position:absolute;inset:0;
  background-image:repeating-linear-gradient(100deg, rgba(255,255,255,.06) 0 3px, transparent 3px 22px);
  opacity:.5;
}
.splash-hero .leaf-badge{
  width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:16px;position:relative;
}
.splash-hero h1{font-size:26px;font-weight:800;position:relative;text-shadow:0 2px 10px rgba(0,0,0,.15);}
.splash-hero p{font-size:13px;opacity:.95;margin-top:4px;position:relative;}
.splash-progress{width:120px;height:4px;background:rgba(255,255,255,.35);border-radius:4px;margin-top:26px;position:relative;overflow:hidden;}
.splash-progress i{position:absolute;left:0;top:0;bottom:0;width:55%;background:#fff;border-radius:4px;}

  background:linear-gradient(160deg,#2E7D32,#1B5E20);
  overflow:hidden;
}
.login-hero::before{
  content:"";position:absolute;inset:0;
  background-image:repeating-linear-gradient(95deg, rgba(255,255,255,.05) 0 3px, transparent 3px 20px);
}
.login-hero .leaf{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:12px;position:relative;}
.login-hero h1{font-size:20px;font-weight:800;position:relative;}
.login-hero p{font-size:12px;opacity:.9;margin-top:4px;position:relative;}
.login-body{padding:24px 22px 10px;flex:1;}
.login-body h2{font-size:19px;font-weight:800;margin-bottom:4px;}
.login-body .lead{font-size:13px;color:var(--muted);margin-bottom:20px;}
.login-footer{text-align:center;padding:18px;font-size:12.5px;color:var(--muted);}
.login-footer a{color:var(--secondary);font-weight:700;}
.remember-row{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 18px;font-size:12.5px;}
.remember-row label{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;}
.remember-row a{color:var(--secondary);font-weight:700;}

/* ---------- Install banner ---------- */
.install-banner{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:#fff;box-shadow:0 -6px 20px rgba(0,0,0,.12);border-radius:20px 20px 0 0;
  padding:16px 18px calc(16px + var(--safe-bottom));z-index:60;display:flex;gap:12px;align-items:flex-start;
}
.install-banner .install-icon{
  width:46px;height:46px;border-radius:14px;background:var(--primary-tint);color:var(--primary-dark);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
}
.install-banner .txt{flex:1;}
.install-banner strong{font-size:14px;}
.install-banner p{font-size:12px;color:var(--muted);margin-top:2px;}
.install-banner .actions{display:flex;gap:10px;margin-top:10px;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:calc(78px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  background:#263238;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:80;
  max-width:88%;text-align:center;box-shadow:var(--shadow);
}

/* ---------- Coordinates table ---------- */
.coord-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.coord-table th{text-align:left;color:var(--muted);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--border);}
.coord-table td{padding:7px 4px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;}

.muted{color:var(--muted);}
.small{font-size:12px;}
.mt-8{margin-top:8px;}
.mt-14{margin-top:14px;}
.center-text{text-align:center;}

@media (max-width:360px){
  .quick-grid{gap:8px;}
  .stat-grid{gap:8px;}
}

// Straight-line distance fallback for the route screen, used only
// if the OSRM-backed /farmer/api/route proxy can't be reached.
function haversineKm(a, b) {
  const R = 6371;
  const dLat = ((b.lat - a.lat) * Math.PI) / 180;
  const dLng = ((b.lng - a.lng) * Math.PI) / 180;
  const s =
    Math.sin(dLat / 2) ** 2 +
    Math.cos((a.lat * Math.PI) / 180) *
      Math.cos((b.lat * Math.PI) / 180) *
      Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}

  const cycle = cropState.cycle;
  if (!cycle) return null;

  const doneKeys = (cropState.stageSummary || []).filter((s) => s.done).map((s) => s.key);

  // Land prep and planting are the two "must happen once, in
  // order" stages — everything after them is guided by timing.
  if (!doneKeys.includes("land_prep")) {
    return { stage: "land_prep", reason: "Start here — land preparation comes before planting." };
  }
  if (!doneKeys.includes("planting")) {
    return { stage: "planting", reason: "Land is prepared — next is planting." };
  }

  const age = daysSince(cycle.planting_date);
  if (age === null) return { stage: "weeding", reason: "Log your next field activity." };

  const harvestDaysLeft = cycle.expected_harvest_date
    ? Math.floor((new Date(cycle.expected_harvest_date).getTime() - Date.now()) / 86400000)
    : null;

  // Score every recurring stage by how central "now" is in its
  // typical window, and how overdue/undone it looks, then suggest
  // the best match. Simple on purpose — this nudges, it doesn't
  // dictate.
  let best = null;
  for (const [key, g] of Object.entries(STAGE_GUIDANCE)) {
    if (key === "land_prep" || key === "planting") continue;
    const w = g.window;
    const inWindow = w.anchorToHarvest
      ? harvestDaysLeft !== null && -harvestDaysLeft >= w.fromDays && -harvestDaysLeft <= w.toDays
      : age >= w.fromDays && age <= w.toDays;
    if (!inWindow) continue;
    const stageInfo = (cropState.stageSummary || []).find((s) => s.key === key);
    const score = stageInfo && stageInfo.done ? 1 : 2; // prefer stages not yet logged this window
    if (!best || score > best.score) best = { stage: key, score };
  }

  if (best) {
    return { stage: best.stage, reason: `Typical timing for this stage, based on a crop that's ${age} days old.` };
  }
  return null;
}

    cropState.stageSummary = data.stage_summary;

function daysSince(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);

async function api(path, opts = {}) {
  try {
    const res = await fetch(path, {
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      ...opts
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    state.usingDemo = false;
    return await res.json();
  } catch (err) {

  state.parcels = (parcels && parcels.length ? parcels : DEMO.parcels);
  // Keep the open parcel's live fields (Status/NDVI-ish extras) in
  // sync with whatever the list just returned for it, if present.
  const matching = state.parcels.find((p) => p.Parcel_ID === state.parcel.Parcel_ID);
  if (matching) state.parcel = { ...state.parcel, ...matching };

  const ndvi = await api(`/farmer/api/parcel/${state.parcel.Parcel_ID}/ndvi`);
  state.ndvi = ndvi || DEMO.ndvi;

  const harvest = await api(`/farmer/api/parcel/${state.parcel.Parcel_ID}/harvest`);

// ---------- Gauge / sparkline helpers ----------
function ndviGauge(value) {
  const pct = Math.max(0, Math.min(1, value));
  const r = 40, c = 2 * Math.PI * r;
  const offset = c * (1 - pct);
  const color = pct >= 0.6 ? "#2E7D32" : pct >= 0.4 ? "#F57C00" : "#E53935";
  return `
  <div class="gauge">
    <svg width="96" height="96" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="${r}" stroke="#EAEDEF" stroke-width="9" fill="none"/>
      <circle cx="48" cy="48" r="${r}" stroke="${color}" stroke-width="9" fill="none"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
    </svg>
    <div class="center">
      <strong>${value.toFixed(2)}</strong>
      <span>${pct >= 0.6 ? "Healthy" : pct >= 0.4 ? "Fair" : "Stressed"}</span>
    </div>
  </div>`;
}

function sparkline(points, height = 60) {
  const min = 0, max = 1;
  const w = 220;
  const step = w / (points.length - 1 || 1);
  const coords = points
    .map((p, i) => {
      const x = i * step;
      const y = height - ((p.value - min) / (max - min)) * height;
      return `${x},${y}`;
    })
    .join(" ");
  return `
  <svg viewBox="0 0 ${w} ${height}" width="100%" height="${height}" preserveAspectRatio="none">
    <polyline points="${coords}" fill="none" stroke="#2E7D32" stroke-width="2.5"/>
    ${points
      .map((p, i) => {
        const x = i * step, y = height - ((p.value - min) / (max - min)) * height;
        return `<circle cx="${x}" cy="${y}" r="3" fill="#2E7D32"/>`;
      })
      .join("")}
  </svg>`;
}

// A field-from-above look built from layered gradients — no photo
// needed, never breaks, colored by the parcel's own health/status.
function fieldThumb(parcel, size = 60) {
  const ndvi = Number(parcel.ndvi ?? parcel.NDVI ?? 0.65); // decorative texture only; not a measured index
  const base = ndvi >= 0.6 ? "#66BB6A,#2E7D32" : ndvi >= 0.4 ? "#AED581,#8D6E63" : "#FFB74D,#E65100";
  const [c1, c2] = base.split(",");
  return `<div class="farm-thumb" style="background:linear-gradient(135deg,${c1},${c2});">
    <div class="rows" style="background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.22) 0 3px, transparent 3px 9px);"></div>
  </div>`;
}

function statusBadgeClass(status) {
  if (status === "Growing") return "growing";
  if (status === "Mature" || status === "Harvested") return "ready";
  return "growing";
}

function ndviOf(parcel) {
  const value = parcel.ndvi ?? parcel.NDVI ?? (parcel.Parcel_ID === state.parcel?.Parcel_ID ? state.ndvi?.current : null);
  return value == null || value === "" ? null : Number(value);
}

function isReadyForHarvest(parcel) {
  return parcel.Harvest_Status === "Due Soon" || parcel.Harvest_Status === "Overdue" || parcel.Status === "Mature";
}

// Rough planar area estimate for on-screen feedback only — the real,
// authoritative area is computed server-side from the PostGIS geometry
// (ST_Area on a geography cast), which accounts for the earth's curvature.
function estimateAreaHa(points) {
  if (points.length < 3) return 0;
  const latRad = (points[0][0] * Math.PI) / 180;
  const mPerDegLat = 111320;
  const mPerDegLng = 111320 * Math.cos(latRad);
  const xy = points.map((p) => [p[1] * mPerDegLng, p[0] * mPerDegLat]);
  let area = 0;
  for (let i = 0; i < xy.length; i++) {
    const [x1, y1] = xy[i];
    const [x2, y2] = xy[(i + 1) % xy.length];
    area += x1 * y2 - x2 * y1;
  }
  return Math.abs(area / 2) / 10000; // m² -> ha
}

function handleSurveyFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const text = reader.result;
      let points = [];
      if (file.name.endsWith(".csv")) {
        points = parseCsvPoints(text);
      } else if (file.name.endsWith(".geojson") || file.name.endsWith(".json")) {
        points = parseGeoJsonPoints(JSON.parse(text));
      } else if (file.name.endsWith(".kml")) {
        points = parseKmlPoints(text);
      } else {
        toast("Unsupported file type.");
        return;
      }
      if (points.length < 3) {
        toast("Couldn't find at least 3 boundary points in that file.");
        return;
      }
      state.newParcel.points = points;
      toast(`Imported ${points.length} points.`);
      render();
    } catch (e) {
      toast("Couldn't read that file — check the format and try again.");
    }
  };
  reader.readAsText(file);
}

// ---------- UTM -> WGS84 conversion ----------
// Survey exports from Total Stations / RTK software very often use
// a projected grid (northing/easting in metres) rather than plain
// lat/lon — this is what a "pid,n,e,z" or "northing,easting" CSV
// almost always means. Assumes UTM Zone 36N (WGS84), which covers
// Kenya's western sugarcane belt (Bungoma, Kakamega, Busia, Mumias
// area) — the zone a real survey should confirm against, since a
// wrong zone/datum can shift a boundary by hundreds of metres.
const UTM_ZONE = 36;
function utmToLatLon(easting, northing) {
  const a = 6378137.0;
  const f = 1 / 298.257223563;
  const e2 = f * (2 - f);
  const e2p = e2 / (1 - e2);
  const k0 = 0.9996;
  const E0 = 500000.0;
  const lon0 = ((-183 + 6 * UTM_ZONE) * Math.PI) / 180;

  const x = easting - E0;
  const y = northing;
  const M = y / k0;
  const mu = M / (a * (1 - e2 / 4 - (3 * e2 ** 2) / 64 - (5 * e2 ** 3) / 256));
  const e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
  const phi1 =
    mu +
    ((3 * e1) / 2 - (27 * e1 ** 3) / 32) * Math.sin(2 * mu) +
    ((21 * e1 ** 2) / 16 - (55 * e1 ** 4) / 32) * Math.sin(4 * mu) +
    ((151 * e1 ** 3) / 96) * Math.sin(6 * mu) +
    ((1097 * e1 ** 4) / 512) * Math.sin(8 * mu);

  const sin1 = Math.sin(phi1), cos1 = Math.cos(phi1), tan1 = Math.tan(phi1);
  const C1 = e2p * cos1 ** 2;
  const T1 = tan1 ** 2;
  const N1 = a / Math.sqrt(1 - e2 * sin1 ** 2);
  const R1 = (a * (1 - e2)) / (1 - e2 * sin1 ** 2) ** 1.5;
  const D = x / (N1 * k0);

  const lat =
    phi1 -
    ((N1 * tan1) / R1) *
      ((D ** 2) / 2 -
        ((5 + 3 * T1 + 10 * C1 - 4 * C1 ** 2 - 9 * e2p) * D ** 4) / 24 +
        ((61 + 90 * T1 + 298 * C1 + 45 * T1 ** 2 - 252 * e2p - 3 * C1 ** 2) * D ** 6) / 720);

  const lon =
    lon0 +
    (D -
      ((1 + 2 * T1 + C1) * D ** 3) / 6 +
      ((5 - 2 * C1 + 28 * T1 - 3 * C1 ** 2 + 8 * e2p + 24 * T1 ** 2) * D ** 5) / 120) /
      cos1;

  return [(lat * 180) / Math.PI, (lon * 180) / Math.PI];
}

// Removes consecutive duplicate points (repeated survey shots at
// the same corner) which would otherwise create a degenerate edge.
function dedupeConsecutive(points) {
  const out = [];
  let prev = null;
  for (const p of points) {
    if (prev && Math.abs(p[0] - prev[0]) < 1e-9 && Math.abs(p[1] - prev[1]) < 1e-9) continue;
    out.push(p);
    prev = p;
  }
  return out;
}

function parseCsvPoints(text) {
  const lines = text.trim().split("\n").map((l) => l.split(",").map((v) => v.trim()));
  if (!lines.length) return [];

  const header = lines[0].map((h) => h.toLowerCase());
  const looksLikeHeader = header.some((h) => isNaN(parseFloat(h)));
  const dataRows = looksLikeHeader ? lines.slice(1) : lines;

  // Detect a northing/easting survey export (e.g. "pid,n,e,z") vs a
  // plain lat,lng file. Column position is taken from the header
  // when there is one; otherwise the first two numeric columns win.
  let latIdx = 0, lngIdx = 1, isUtm = false;
  if (looksLikeHeader) {
    const nIdx = header.findIndex((h) => h === "n" || h === "north" || h === "northing" || h === "y");
    const eIdx = header.findIndex((h) => h === "e" || h === "east" || h === "easting" || h === "x");
    const latHdr = header.findIndex((h) => h.includes("lat"));
    const lngHdr = header.findIndex((h) => h.includes("lon") || h.includes("lng"));
    if (nIdx !== -1 && eIdx !== -1) {
      latIdx = nIdx; lngIdx = eIdx; isUtm = true;
    } else if (latHdr !== -1 && lngHdr !== -1) {
      latIdx = latHdr; lngIdx = lngHdr;
    }
  }

  const raw = dataRows
    .filter((cols) => cols.length > Math.max(latIdx, lngIdx) &&
      !isNaN(parseFloat(cols[latIdx])) && !isNaN(parseFloat(cols[lngIdx])))
    .map((cols) => [parseFloat(cols[latIdx]), parseFloat(cols[lngIdx])]);

  // A plain lat/lon pair is always within [-90,90]/[-180,180]; UTM
  // northing/easting values run into the tens or hundreds of
  // thousands, so this is also a safety net if the header naming
  // didn't match anything above.
  const looksUtmByMagnitude = raw.length > 0 && (Math.abs(raw[0][0]) > 90 || Math.abs(raw[0][1]) > 180);

  const converted = (isUtm || looksUtmByMagnitude)
    ? raw.map(([n, e]) => utmToLatLon(e, n))
    : raw;

  return dedupeConsecutive(converted);
}

function parseGeoJsonPoints(gj) {
  const coords =
    gj.type === "Feature" ? gj.geometry.coordinates[0] :
    gj.type === "Polygon" ? gj.coordinates[0] :
    gj.type === "FeatureCollection" ? gj.features[0].geometry.coordinates[0] : [];
  return coords.slice(0, -1).map((c) => [c[1], c[0]]); // geojson is [lng,lat]
}

function parseKmlPoints(text) {
  const doc = new DOMParser().parseFromString(text, "text/xml");
  const coordText = doc.querySelector("coordinates")?.textContent || "";
  return coordText
    .trim()
    .split(/\s+/)
    .map((triplet) => triplet.split(",").map(Number))
    .filter((c) => c.length >= 2)
    .map((c) => [c[1], c[0]]); // kml is lng,lat[,alt]
}

async function saveNewParcel() {
  const np = state.newParcel;
  if (np.points.length < 3) {
    toast("Capture or import at least 3 boundary points first.");

  }
  const payload = {
    variety: document.getElementById("np-variety").value || null,
    planting_date: document.getElementById("np-planting").value || null,
    boundary: np.points,
    boundary_source: np.method
  };
  const res = await api("/farmer/api/parcel", { method: "POST", body: JSON.stringify(payload) });
  if (res && res.success) {
    toast(`Farm ${res.parcel.Parcel_ID} saved — ${res.area_ha} Ha.`);
    state.newParcel = { points: [], method: "gps_walk", variety: "", planting_date: "" };
    state.parcel = res.parcel;
    const parcels = await api("/farmer/api/parcels");
    if (parcels) state.parcels = parcels;
    go("/farms");
  } else {
    toast(res?.error || "Saved locally — will sync once you're back online.");
  }
}

// ---------- Map (Leaflet) ----------
let mapObj = null;
// ---------- Basemap: OpenStreetMap + Satellite ----------
// Every map in the app gets both, with a standard Leaflet layer
// switcher — satellite matters here specifically so a farmer/staff
// can visually check a boundary against real imagery, not just a
// street map (which often shows nothing at all in rural areas).
function addBaseLayers(map, { satelliteByDefault = false } = {}) {
  const streets = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  });
  const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { attribution: "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics", maxZoom: 19 }
  );

  (satelliteByDefault ? satellite : streets).addTo(map);
  L.control
    .layers({ "OpenStreetMap": streets, "Satellite imagery": satellite }, null, { position: "topright", collapsed: false })
    .addTo(map);
  L.control.scale({ position: "bottomleft", imperial: false }).addTo(map);
}

function afterRender(path) {
  if (path === "/map" || path === "/route") {
    setTimeout(() => initMap(path), 30);
  }
  if (path === "/add-parcel" && state.newParcel.method === "manual_draw") {
    setTimeout(() => initDrawMap(), 30);
  }
  if (path === "/add-parcel" && state.newParcel.method === "imported_survey" && state.newParcel.points.length >= 3) {
    setTimeout(() => initImportPreviewMap(), 30);
  }
}

function initMap(path) {
  const el = document.getElementById("leaflet-map");
  if (!el || typeof L === "undefined") return;
  const p = state.parcel;
  mapObj = L.map(el, { zoomControl: true, scrollWheelZoom: false, minZoom: 5, maxZoom: 19 });
  addBaseLayers(mapObj, { satelliteByDefault: true });

  const boundary = p.boundary.map((c) => [c[0], c[1]]);
  const outline = L.polygon(boundary, { color: "#075E36", fillColor: "#24A866", fillOpacity: 0.26, weight: 3, opacity: 0.95, lineJoin: "round" }).addTo(mapObj);
  outline.bindTooltip(p.Parcel_ID, { permanent: true, direction: "center", className: "farm-boundary-label" });
  mapObj.fitBounds(outline.getBounds(), { padding: [24, 24], maxZoom: 17 });

  if (path === "/route") {
    drawRoute(p);
  }
}

function initImportPreviewMap() {
  const el = document.getElementById("import-preview-map");
  if (!el || typeof L === "undefined") return;
  const points = state.newParcel.points;
  const map = L.map(el, { zoomControl: false }).setView(points[0], 16);
  addBaseLayers(map, { satelliteByDefault: true }); // satellite by default here — the whole point is visual verification
  L.polygon(points, { color: "#F57C00", fillColor: "#FFB74D", fillOpacity: 0.35, weight: 3 }).addTo(map);
  points.forEach((c) => L.circleMarker(c, { radius: 3, color: "#E65100", fillColor: "#fff", fillOpacity: 1 }).addTo(map));
  map.fitBounds(L.latLngBounds(points), { padding: [20, 20] });
}

function locateMe() {
  if (!navigator.geolocation || !mapObj) return;
  navigator.geolocation.getCurrentPosition((pos) => {
    const me = [pos.coords.latitude, pos.coords.longitude];
    L.marker(me).addTo(mapObj).bindPopup("You are here").openPopup();
    mapObj.setView(me, 15);
  });
}

async function drawRoute(p) {
  if (!navigator.geolocation) {
    document.getElementById("route-dist").textContent = "Enable location to calculate route";
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const start = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    const dest = p.center;
    L.marker([start.lat, start.lng]).addTo(mapObj).bindPopup("Your location");
    const data = await api(
      `/farmer/api/route?startLat=${start.lat}&startLng=${start.lng}&destLat=${dest.lat}&destLng=${dest.lng}`
    );
    if (data && data.routes && data.routes[0]) {
      const coords = data.routes[0].geometry.coordinates.map((c) => [c[1], c[0]]);
      L.polyline(coords, { color: "#1E88E5", weight: 5 }).addTo(mapObj);
      const km = (data.routes[0].distance / 1000).toFixed(1);
      const min = Math.round(data.routes[0].duration / 60);
      document.getElementById("route-dist").textContent = `${km} km · ${min} min`;
      mapObj.fitBounds(L.latLngBounds(coords));
    } else {
      L.polyline([[start.lat, start.lng], [dest.lat, dest.lng]], { color: "#1E88E5", weight: 4, dashArray: "6 8" }).addTo(mapObj);
      const km = haversineKm(start, dest).toFixed(1);
      document.getElementById("route-dist").textContent = `~${km} km (straight line — live routing unavailable)`;
      mapObj.fitBounds(L.latLngBounds([[start.lat, start.lng], [dest.lat, dest.lng]]));
    }
  });
}

      <div class="actions">
        <button class="btn btn-primary btn-sm" onclick="installApp()">Add</button>
        <button class="btn btn-secondary btn-sm" onclick="dismissInstall()">Not Now</button>
      </div>
    </div>`;
  document.body.appendChild(b);
}

async function installApp() {
  if (!deferredPrompt) {
    toast("On iPhone: tap Share → Add to Home Screen.");
    dismissInstall();
    return;
  }
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  dismissInstall();
}

function dismissInstall() {
  localStorage.setItem("installDismissed", "1");
  document.getElementById("install-banner")?.remove();
}

// ---------- Boot ----------
async function boot() {
  // Crop management screens live in crop.js and register
  // themselves here, so the router stays defined in one place.
  if (typeof registerCropRoutes === "function") registerCropRoutes(routes);
  await loadFarmerData();
  await render();
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone) {
    setTimeout(showInstallBanner, 1500);
  }
}

boot();
</script></body></html>
