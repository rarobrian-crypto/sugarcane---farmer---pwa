<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sugarcane GIS Prototype</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html, body{
    margin:0;
    padding:0;
    height:100%;
}

#map{
    width:100%;
    height:100vh;
}

</style>

</head>

<body>

<div id="map"></div>

<script>

//---------------------------------------------------------
// CREATE MAP
//---------------------------------------------------------

var map = L.map('map');

//---------------------------------------------------------
// OPENSTREETMAP BASEMAP
//---------------------------------------------------------

var osm = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap Contributors',
    maxZoom:22
});

osm.addTo(map);

//---------------------------------------------------------
// GOOGLE SATELLITE (OPTIONAL)
//---------------------------------------------------------

var satellite = L.tileLayer(
'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
{
    maxZoom:22,
    attribution:'Google Satellite'
});

//---------------------------------------------------------
// GEOSERVER WMS
//---------------------------------------------------------

var parcels = L.tileLayer.wms(

'http://localhost:8080/geoserver/sugarcane/wms',

{

layers:'sugarcane:parcels',

format:'image/png',

transparent:true,

version:'1.1.1'

}

);

parcels.addTo(map);

//---------------------------------------------------------
// ZOOM TO YOUR PARCELS
//---------------------------------------------------------

var bounds = [

[0.4869866823442492,35.22824578717585],

[0.5629668677041365,35.2673531913434]

];

map.fitBounds(bounds);

//---------------------------------------------------------
// SCALE BAR
//---------------------------------------------------------

L.control.scale({

metric:true,

imperial:false

}).addTo(map);

//---------------------------------------------------------
// LAYER CONTROL
//---------------------------------------------------------

var baseMaps={

"OpenStreetMap":osm,

"Satellite":satellite

};

var overlayMaps={

"Sugarcane Parcels":parcels

};

L.control.layers(

baseMaps,

overlayMaps

).addTo(map);

</script>

</body>

</html>
